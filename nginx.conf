server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Planr ist eine Single-Page-App ohne Router-Pfade, der Fallback deckt
    # trotzdem direkte Aufrufe von Unterpfaden ab.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Assets sind unveraenderlich, index.html darf nie im Cache haengen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
