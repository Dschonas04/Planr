services:
  planr:
    build: .
    image: planr:latest
    container_name: planr
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PLANR_DATA: /data
      # Konten legt die Verwaltung an; "offen" erlaubt Selbstregistrierung.
      PLANR_REGISTRIERUNG: ${PLANR_REGISTRIERUNG:-geschlossen}
      # Hinter einem Reverse Proxy mit TLS auf "ja" setzen.
      PLANR_HINTER_PROXY: ${PLANR_HINTER_PROXY:-nein}
      PLANR_METRIKEN: ${PLANR_METRIKEN:-nein}
    volumes:
      # Ohne dieses Volume waeren alle Projekte nach einem Neuaufbau weg.
      - planr-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  planr-data:
